name: Phase 13 Frontend Integration CI

on:
  push:
    branches: ["phase13/**"]
    paths:
      - "customer-frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/phase13-frontend-ci.yml"
  pull_request:
    branches: ["phase12/additional-integrations"]
    paths:
      - "customer-frontend/**"
      - "admin-frontend/**"
      - ".github/workflows/phase13-frontend-ci.yml"
  workflow_dispatch:

jobs:
  customer-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: customer-frontend/package-lock.json
      - run: npm ci
      - run: npm run verify:phase6
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke test customer routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/luxe-customer.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then break; fi
            sleep 2
          done
          for route in / /shop /login /register /forgot-password /cart /checkout /my-orders /track-order /contact; do
            curl -fsS "http://127.0.0.1:3000$route" >/dev/null
          done

  admin-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Smoke test admin routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/luxe-admin.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/login >/dev/null; then break; fi
            sleep 2
          done
          for route in /login / /products /categories /brands /collections /orders /customers /inventory /payments /returns /contact-messages /coupons /banners /reviews /newsletter /analytics /staff; do
            curl -fsS "http://127.0.0.1:3001$route" >/dev/null
          done
