name: Admin Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "admin-frontend/**"
      - ".github/workflows/admin-frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "admin-frontend/**"
      - ".github/workflows/admin-frontend-ci.yml"
  workflow_dispatch:

jobs:
  verify-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Static Phase 3 verification
        run: npm run verify:phase3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
