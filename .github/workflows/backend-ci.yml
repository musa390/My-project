name: Backend Foundation and Catalog CI

on:
  push:
    branches: [main, "phase5/**", "phase6/**", "phase7/**", "phase8/**", "phase9/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "database/**"
      - "docs/PHASE7-PRODUCT-CATALOG-*.md"
      - "docs/PHASE8-CART-WISHLIST-INVENTORY-*.md"
      - "docs/PHASE9-CHECKOUT-ORDER-MANAGEMENT-*.md"
      - "docs/PROJECT_STATUS.md"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - "database/**"
      - "docs/PHASE7-PRODUCT-CATALOG-*.md"
      - "docs/PHASE8-CART-WISHLIST-INVENTORY-*.md"
      - "docs/PHASE9-CHECKOUT-ORDER-MANAGEMENT-*.md"
      - "docs/PROJECT_STATUS.md"
  workflow_dispatch:

jobs:
  backend-build-and-migration-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: luxe_perfume
          MYSQL_USER: luxe_app
          MYSQL_PASSWORD: ci_app_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: luxe_perfume
      MYSQL_USER: luxe_app
      MYSQL_PASSWORD: ci_app_password
      BACKEND_PORT: 8080
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, test and verify Flyway migrations
        id: backend-verify
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Diagnose MySQL foreign-key failure
        if: failure()
        run: |
          mysql --host=127.0.0.1 --port=3306 --user=root --password=ci_root_password luxe_perfume --execute="SHOW ENGINE INNODB STATUS\\G"
