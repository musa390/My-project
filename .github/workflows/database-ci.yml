name: Database Migration CI

on:
  push:
    paths:
      - "backend/src/main/resources/db/migration/**"
      - "database/**"
      - ".github/workflows/database-ci.yml"
  pull_request:
    paths:
      - "backend/src/main/resources/db/migration/**"
      - "database/**"
      - ".github/workflows/database-ci.yml"
  workflow_dispatch:

jobs:
  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password_only_for_ephemeral_runner
          MYSQL_DATABASE: luxe_perfume
          MYSQL_USER: luxe_app
          MYSQL_PASSWORD: ci_app_password_only_for_ephemeral_runner
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password_only_for_ephemeral_runner --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      MYSQL_ROOT_PASSWORD: ci_root_password_only_for_ephemeral_runner
      MYSQL_DATABASE: luxe_perfume
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply V1 schema migration
        shell: bash
        run: |
          docker run --rm -i --network host -v "$GITHUB_WORKSPACE:/workspace" -w /workspace --entrypoint mysql mysql:8.4 --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < backend/src/main/resources/db/migration/V1__create_core_schema.sql

      - name: Apply V2 development seed migration
        shell: bash
        run: |
          docker run --rm -i --network host -v "$GITHUB_WORKSPACE:/workspace" -w /workspace --entrypoint mysql mysql:8.4 --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < backend/src/main/resources/db/migration/V2__insert_development_sample_data.sql

      - name: Verify Phase 4 schema, constraints and sample data
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i --network host -v "$GITHUB_WORKSPACE:/workspace" -w /workspace --entrypoint mysql mysql:8.4 --batch --raw --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < database/verification/phase4_verify.sql | tee phase4-verification-output.txt
          if grep -q "FAIL" phase4-verification-output.txt; then
            echo "One or more Phase 4 database assertions failed."
            exit 1
          fi

      - name: Apply V3 authentication migration
        shell: bash
        run: |
          docker run --rm -i --network host -v "$GITHUB_WORKSPACE:/workspace" -w /workspace --entrypoint mysql mysql:8.4 --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < backend/src/main/resources/db/migration/V3__authentication_sessions_and_password_resets.sql

      - name: Verify Phase 6 authentication tables
        shell: bash
        run: |
          set -euo pipefail
          printf "%s\\n" "SHOW TABLES LIKE 'auth_sessions';" "SHOW TABLES LIKE 'password_reset_tokens';" | docker run --rm -i --network host --entrypoint mysql mysql:8.4 --batch --skip-column-names --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" | tee phase6-auth-tables.txt
          grep -qx "auth_sessions" phase6-auth-tables.txt
          grep -qx "password_reset_tokens" phase6-auth-tables.txt

      - name: Apply V4-V9 business logic and integration migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in \
            V4__payment_idempotency_refunds_and_events.sql \
            V5__payment_refund_permission.sql \
            V6__payment_refund_reconciliation_reference.sql \
            V7__user_notifications.sql \
            V8__return_requests_and_audit.sql \
            V9__external_integrations_contact_and_newsletter.sql; do
            docker run --rm -i --network host -v "$GITHUB_WORKSPACE:/workspace" -w /workspace --entrypoint mysql mysql:8.4 --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" < "backend/src/main/resources/db/migration/$migration"
          done

      - name: Verify Phase 10, Phase 11 and Phase 12 tables
        shell: bash
        run: |
          set -euo pipefail
          printf "%s\\n" \
            "SHOW TABLES LIKE 'payment_refunds';" \
            "SHOW TABLES LIKE 'payment_events';" \
            "SHOW TABLES LIKE 'user_notifications';" \
            "SHOW TABLES LIKE 'return_requests';" \
            "SHOW TABLES LIKE 'return_request_events';" \
            "SHOW TABLES LIKE 'contact_messages';" \
            "SHOW COLUMNS FROM newsletter_subscribers LIKE 'confirmation_token_hash';" \
            | docker run --rm -i --network host --entrypoint mysql mysql:8.4 --batch --skip-column-names --host=127.0.0.1 --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" | tee phase11-business-tables.txt
          for table in payment_refunds payment_events user_notifications return_requests return_request_events contact_messages; do
            grep -qx "$table" phase11-business-tables.txt
          done
          grep -q "^confirmation_token_hash" phase11-business-tables.txt
