spring:
  application:
    name: luxe-perfume-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:luxe_perfume}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${MYSQL_USER:luxe_app}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
server:
  port: ${PORT:${BACKEND_PORT:8080}}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
app:
  storefront-url: ${STOREFRONT_URL:http://localhost:3000}
  contact:
    admin-email: ${CONTACT_ADMIN_EMAIL:}
  checkout:
    # Explicit development defaults; set these server-side for the real delivery/tax policy.
    shipping:
      flat-rate: ${CHECKOUT_SHIPPING_FLAT_RATE:0.00}
    tax:
      percentage: ${CHECKOUT_TAX_PERCENTAGE:0.00}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  security:
    cookies:
      secure: ${AUTH_COOKIE_SECURE:false}
    jwt:
      # Development-only fallback. Production must supply JWT_SECRET_BASE64 via secret manager.
      secret-base64: ${JWT_SECRET_BASE64:VGhpc0lzRGV2ZWxvcG1lbnRPbmx5S2V5Rm9yTHV4ZVBlcmZ1bWVBdXRoIQ==}
      issuer: ${JWT_ISSUER:luxe-perfume-api}
      access-minutes: ${JWT_ACCESS_MINUTES:10}
      refresh-days: ${JWT_REFRESH_DAYS:14}
    password-reset:
      frontend-url: ${PASSWORD_RESET_FRONTEND_URL:http://localhost:3000/reset-password}
    email:
      resend-api-key: ${RESEND_API_KEY:}
      from: ${AUTH_EMAIL_FROM:onboarding@resend.dev}
    oauth-success-redirect: ${AUTH_OAUTH_SUCCESS_REDIRECT:http://localhost:3000/account}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:true}
  api-docs:
    path: /v3/api-docs
logging:
  level:
    org.flywaydb: INFO
