<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-labelledby="title desc">
  <title id="title">LUXE fragrance image placeholder</title>
  <desc id="desc">A minimal perfume bottle silhouette on a warm neutral background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#24201a"/>
      <stop offset="1" stop-color="#100f0d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a98a56" stop-opacity=".38"/>
      <stop offset=".5" stop-color="#e1c58c" stop-opacity=".16"/>
      <stop offset="1" stop-color="#80663e" stop-opacity=".48"/>
    </linearGradient>
  </defs>
  <rect width="640" height="800" fill="url(#bg)"/>
  <circle cx="320" cy="365" r="205" fill="#c9a96e" opacity=".05"/>
  <rect x="267" y="180" width="106" height="72" rx="8" fill="#b69a68" opacity=".8"/>
  <rect x="286" y="132" width="68" height="56" rx="5" fill="#d0b27a"/>
  <rect x="190" y="245" width="260" height="350" rx="38" fill="url(#glass)" stroke="#c5a46b" stroke-opacity=".75" stroke-width="5"/>
  <path d="M215 285 Q320 250 425 285" fill="none" stroke="#f1dfb7" stroke-opacity=".25" stroke-width="8"/>
  <rect x="224" y="365" width="192" height="130" rx="5" fill="#15120e" stroke="#b99b65" stroke-width="2"/>
  <text x="320" y="424" text-anchor="middle" fill="#d7bd8b" font-family="Georgia,serif" font-size="42" letter-spacing="8">LUXE</text>
  <text x="320" y="458" text-anchor="middle" fill="#b99b65" font-family="Arial,sans-serif" font-size="13" letter-spacing="5">PERFUME</text>
  <text x="320" y="710" text-anchor="middle" fill="#a28b63" font-family="Arial,sans-serif" font-size="14" letter-spacing="5">IMAGE NOT AVAILABLE</text>
</svg>
